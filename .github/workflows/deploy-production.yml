name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck:web
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::960243570517:role/jamiblossum-github-production-deploy
          aws-region: ap-northeast-2
      - name: Build, deploy, and verify exact release
        shell: pwsh
        run: ./scripts/deploy-web.ps1 -ReleaseId "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-receipt-${{ github.sha }}
          path: deploy/releases/*.json
          if-no-files-found: warn
